name: Prepare signed release (no publication)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: vars.LATCH_RELEASE_PREPARATION_ENABLED == 'true'
    environment: release-preparation
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift format lint --strict --recursive --configuration .swift-format Package.swift Sources Tests
      - run: swift test -c release
      - name: Sign and notarize using the runner's configured keychain
        env:
          SIGNING_IDENTITY: ${{ vars.LATCH_DEVELOPER_ID_APPLICATION }}
          NOTARY_PROFILE: ${{ vars.LATCH_NOTARY_KEYCHAIN_PROFILE }}
        run: swift run -c release LatchRelease --binary .build/release/latch --output .build/release-artifacts --installer install.sh --signing-identity "$SIGNING_IDENTITY" --notary-profile "$NOTARY_PROFILE"
      - uses: actions/upload-artifact@v7
        with:
          name: signed-release-for-review
          path: .build/release-artifacts/
          if-no-files-found: error
